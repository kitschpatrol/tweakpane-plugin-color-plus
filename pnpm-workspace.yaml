allowBuilds:
  # Sass uses its JS API; its optional native watcher is not needed.
  '@parcel/watcher': false
  esbuild: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/cspell-config@8.14.1'
  - '@kitschpatrol/eslint-config@8.14.1'
  - '@kitschpatrol/knip-config@8.14.1'
  - '@kitschpatrol/mdat-config@8.14.1'
  - '@kitschpatrol/prettier-config@8.14.1'
  - '@kitschpatrol/remark-config@8.14.1'
  - '@kitschpatrol/repo-config@8.14.1'
  - '@kitschpatrol/shared-config@8.14.1'
  - '@kitschpatrol/stylelint-config@8.14.1'
  - '@kitschpatrol/typescript-config@8.14.1'
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
